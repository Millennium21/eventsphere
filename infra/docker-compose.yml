x-api-env: &api-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://eventsphere:eventsphere_pw@postgres:5432/eventsphere
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  INVENTORY_GRPC_TARGET: inventory:50051
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-only-secret-do-not-use-in-production}
  CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'

x-inventory-env: &inventory-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://eventsphere:eventsphere_pw@postgres:5432/eventsphere
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventsphere
      POSTGRES_PASSWORD: eventsphere_pw
      POSTGRES_DB: eventsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsphere -d eventsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for other containers on the compose network
      # (kafka:29092), one for tools/scripts run from the host (localhost:9092).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEFAULT_PARTITIONS: 3
      LOCAL_REPLICATION_FACTOR: 1
    volumes:
      - ./infra/kafka/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["bash", "/create_topics.sh"]
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://eventsphere:eventsphere_pw@postgres:5432/eventsphere
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      inventory:
        condition: service_started
    environment: *api-env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    depends_on:
      api:
        condition: service_healthy
    environment: *api-env
    command: ["python", "-m", "services.api.app.workers.main"]

  inventory:
    build:
      context: .
      dockerfile: infra/Dockerfile.inventory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *inventory-env
    ports:
      - "50051:50051"

  inventory-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.inventory
    depends_on:
      inventory:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment: *inventory-env
    command: ["python", "-m", "services.inventory.app.workers.main"]

  # Optional local dev tools, not needed to run the app itself:
  #   docker compose --profile tools up
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eventsphere
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@eventsphere.local
      PGADMIN_DEFAULT_PASSWORD: dev

volumes:
  postgres_data:
