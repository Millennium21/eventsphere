apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-worker
  namespace: eventsphere
  labels:
    app.kubernetes.io/name: inventory-worker
    app.kubernetes.io/part-of: eventsphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-worker
    spec:
      containers:
        - name: inventory-worker
          image: eventsphere/inventory:latest # same image as the inventory Deployment
          command: ["python", "-m", "services.inventory.app.workers.main"]
          envFrom:
            - configMapRef:
                name: eventsphere-config
            - secretRef:
                name: eventsphere-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
