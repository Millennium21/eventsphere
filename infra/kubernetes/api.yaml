apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: eventsphere
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: eventsphere
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: eventsphere/api:latest # replaced by CI with the built sha tag — see .github/workflows/cd.yml
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: eventsphere-config
            - secretRef:
                name: eventsphere-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      # uvicorn/Python don't need to write anywhere at runtime; paired
      # with readOnlyRootFilesystem above as basic hardening.
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: eventsphere
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 80
      targetPort: http
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: eventsphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
