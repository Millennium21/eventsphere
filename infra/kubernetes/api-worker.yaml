apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-worker
  namespace: eventsphere
  labels:
    app.kubernetes.io/name: api-worker
    app.kubernetes.io/part-of: eventsphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-worker
    spec:
      containers:
        - name: api-worker
          image: eventsphere/api:latest # same image as the api Deployment
          command: ["python", "-m", "services.api.app.workers.main"]
          envFrom:
            - configMapRef:
                name: eventsphere-config
            - secretRef:
                name: eventsphere-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      # No readiness/liveness HTTP probes here — this process has no
      # server socket to probe. A production setup would instead scale
      # this Deployment on consumer-group lag (e.g. via KEDA watching
      # Kafka) rather than CPU/memory HPA, since "am I keeping up with
      # the topic" is the metric that actually matters for a consumer.
