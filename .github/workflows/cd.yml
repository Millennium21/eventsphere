name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, inventory]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eventsphere-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys only if a DEPLOY_ENABLED repo variable has been switched on —
  # keeps the workflow runnable (build/push still happens) in forks or
  # demo clones that don't have a real cluster to deploy to.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Roll out the new images
        run: |
          kubectl -n eventsphere set image deployment/api api=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eventsphere-api:sha-${{ github.sha }}
          kubectl -n eventsphere set image deployment/api-worker api-worker=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eventsphere-api:sha-${{ github.sha }}
          kubectl -n eventsphere set image deployment/inventory inventory=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eventsphere-inventory:sha-${{ github.sha }}
          kubectl -n eventsphere set image deployment/inventory-worker inventory-worker=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eventsphere-inventory:sha-${{ github.sha }}
          kubectl -n eventsphere rollout status deployment/api --timeout=120s
          kubectl -n eventsphere rollout status deployment/inventory --timeout=120s
