[project]
name = "eventsphere"
version = "1.0.0"
description = "Distributed event ticketing platform: FastAPI REST + gRPC inventory microservices over Kafka, Postgres, and Redis."
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 115
target-version = "py312"
exclude = ["services/shared/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ASYNC"]
ignore = ["N802"]  # gRPC servicer methods use PascalCase to match the generated interface

[tool.ruff.lint.isort]
known-first-party = ["services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs real Postgres/Redis (and sometimes an in-process gRPC server)",
    "contract: verifies the gRPC/OpenAPI contracts in isolation",
]